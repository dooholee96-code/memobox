<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>메모함</title>
  <meta name="description" content="이 기기에 저장되는 개인용 메모·클립보드·세컨드브레인">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="메모함">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <section class="omni">
      <textarea id="omni" rows="1" placeholder="키워드: 짧은 설명  ·  찾을 말" autocomplete="off" enterkeyhint="enter"></textarea>
      <div class="omni-row">
        <button id="clipBtn" class="text-btn" type="button">클립보드에서 저장</button>
        <button id="clearBtn" class="text-btn" type="button" hidden>지우기</button>
        <span id="omniHint" class="muted small hint"></span>
        <button id="bigBtn" class="text-btn" type="button" hidden>크게 쓰기</button>
        <button id="saveBtn" class="text-btn strong" type="button" disabled>저장</button>
      </div>
    </section>

    <div id="banner"></div>
    <div id="pins" class="pins"></div>
    <div id="today"></div>
    <nav id="chips" class="chips" aria-label="모아보기"></nav>
    <div id="viewHead" class="view-head"></div>
    <div id="stream" class="stream"></div>
    <section id="palace" class="palace" hidden></section>
    <section id="maze" class="maze" hidden></section>
  </div>

  <button id="fab" class="fab" type="button" aria-label="메뉴: 보기 바꾸기 · 태그 · 설정·백업"><span></span><span></span><span></span></button>

  <dialog id="editor" class="editor"></dialog>
  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="imageInput" type="file" accept="image/*" hidden>
  <input id="importInput" type="file" accept=".json,.md,.markdown,.txt,application/json,text/markdown,text/plain" multiple hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
